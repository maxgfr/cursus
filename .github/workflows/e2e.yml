name: E2E
# Playwright on every device class, each project split into shards that run in parallel (a WebKit project in one
# job takes a quarter of an hour). The tests run in Playwright's own image, browsers and their system libraries
# included: installing those libraries from the runner's apt mirror took up to an hour. Not a release gate: a red
# run is reported here and fixed, but it does not hold back a release or a deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, webkit-desktop, webkit-iphone, webkit-ipad]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: docker version
      - run: bun run build
      # The image of the Playwright version in the lockfile; the S3 emulator runs beside it, on the runner's
      # network. The runner's Bun runs inside (as `bun` and as `bunx`).
      - run: |
          version=$(bun -e "console.log(require('@playwright/test/package.json').version)")
          bun_bin=$(command -v bun)
          bun scripts/with-s3.ts docker run --rm --init --ipc=host --network=host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$bun_bin:/usr/local/bin/bun:ro" -v "$bun_bin:/usr/local/bin/bunx:ro" \
            "mcr.microsoft.com/playwright:v$version-noble" \
            bunx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
